name: local-review regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-regression:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure regression dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            brew install jq
          fi
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi

      - name: Check shell syntax
        run: |
          for shell_script in bin/*.sh scripts/*.sh evals/*.sh; do
            bash -n "$shell_script"
          done

      - name: Run deterministic regression suites
        run: |
          bash ./evals/test-regression-runner.sh
          python3 scripts/run-regression.py full --jobs 2
